name: Prepare persistent inventory

on:
  push:
    branches:
      - feat/persistent-inventory
    paths:
      - .github/workflows/prepare-persistent-inventory.yml
      - src/app/inventory-list.tsx

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Wire persistent inventory into camera flow
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/app/inventory.tsx')
          text = path.read_text()

          def replace_once(old: str, new: str):
              global text
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one match, found {text.count(old)} for: {old[:80]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              "import { CameraView, useCameraPermissions } from 'expo-camera';\n",
              "import { CameraView, useCameraPermissions } from 'expo-camera';\nimport { useRouter } from 'expo-router';\n",
          )

          replace_once(
              "} from '@/inventory/detection';\n",
              "} from '@/inventory/detection';\nimport { saveInventoryItems, type StoredInventoryItem } from '@/inventory/storage';\n",
          )

          replace_once(
              "export default function InventoryScreen() {\n  const colors = useThemeColors();\n",
              "export default function InventoryScreen() {\n  const colors = useThemeColors();\n  const router = useRouter();\n",
          )

          replace_once(
              "  const [message, setMessage] = useState<string | null>(null);\n",
              "  const [message, setMessage] = useState<string | null>(null);\n  const [isSaving, setIsSaving] = useState(false);\n  const [savedItems, setSavedItems] = useState<StoredInventoryItem[]>([]);\n",
          )

          replace_once(
              "  function handleStartOver() {\n",
              "  async function handleConfirm() {\n    if (isSaving) {\n      return;\n    }\n\n    setIsSaving(true);\n    setMessage(null);\n\n    try {\n      const saved = await saveInventoryItems(\n        includedItems.map((item) => ({\n          name: item.name,\n          sourceLabel: item.sourceLabel,\n          confidence: item.confidence,\n        }))\n      );\n      setSavedItems(saved);\n      setStage('confirmed');\n    } catch (error) {\n      console.error('Could not save local inventory', error);\n      setMessage('Не вдалося зберегти інвентар на цьому пристрої. Спробуйте ще раз.');\n    } finally {\n      setIsSaving(false);\n    }\n  }\n\n  function handleStartOver() {\n",
          )

          replace_once(
              "    setMessage(null);\n    setCameraReady(false);\n    setStage('camera');\n  }\n\n  const includedItems",
              "    setMessage(null);\n    setSavedItems([]);\n    setCameraReady(false);\n    setStage('camera');\n  }\n\n  const includedItems",
          )

          replace_once(
              "                {hasBlankIncludedName ? (\n",
              "                {message ? <ErrorText>{message}</ErrorText> : null}\n                {hasBlankIncludedName ? (\n",
          )

          replace_once(
              "                  accessibilityState={{ disabled: !canConfirm }}\n                  disabled={!canConfirm}\n                  onPress={() => setStage('confirmed')}\n                  size=\"lg\">\n                  {`Підтвердити ${includedItems.length} ${\n                    includedItems.length === 1 ? 'річ' : 'речі'\n                  }`}\n",
              "                  accessibilityState={{ disabled: !canConfirm || isSaving }}\n                  disabled={!canConfirm || isSaving}\n                  loading={isSaving}\n                  onPress={() => void handleConfirm()}\n                  size=\"lg\">\n                  {isSaving\n                    ? 'Зберігаємо…'\n                    : `Зберегти ${includedItems.length} ${\n                        includedItems.length === 1 ? 'річ' : 'речі'\n                      }`}\n",
          )

          replace_once(
              "                  Інвентар підтверджено локально\n",
              "                  Інвентар збережено\n",
          )

          replace_once(
              "                  Речі розпізнані на цьому пристрої. Дані не відправлені в backend і не збережені\n                  після цього сеансу.\n",
              "                  Речі збережені локально на цьому пристрої й залишаться після перезапуску застосунку. Backend-синхронізацію ще не налаштовано.\n",
          )

          replace_once(
              "                  {includedItems.map((item) => (\n                    <Text key={item.id}>• {item.name.trim()}</Text>\n",
              "                  {savedItems.map((item) => (\n                    <Text key={item.id}>• {item.name}</Text>\n",
          )

          replace_once(
              "                <Button onPress={handleStartOver} size=\"lg\">\n                  Додати ще фото\n                </Button>\n",
              "                <Button onPress={() => router.push('/inventory-list')} size=\"lg\">\n                  Переглянути мій інвентар\n                </Button>\n                <Button onPress={handleStartOver} size=\"lg\" variant=\"outline\">\n                  Додати ще фото\n                </Button>\n",
          )

          path.write_text(text)
          PY

      - name: Add Expo SQLite dependency
        run: npm install expo-sqlite@~57.0.3 --save --package-lock-only --ignore-scripts

      - name: Install dependencies for static checks
        run: npm ci

      - name: Check TypeScript for new errors
        run: |
          set +e
          npm run typecheck 2>&1 | tee /tmp/typecheck.log
          status=${PIPESTATUS[0]}
          set -e

          python3 <<'PY'
          from pathlib import Path

          known = (
              "src/app/_layout.tsx(1,8): error TS2882:",
              "src/components/ui/switch.tsx(6,18): error TS2430:",
          )
          error_lines = [
              line for line in Path('/tmp/typecheck.log').read_text().splitlines()
              if 'error TS' in line
          ]
          unexpected = [
              line for line in error_lines
              if not any(line.startswith(prefix) for prefix in known)
          ]

          if unexpected:
              print('Unexpected TypeScript errors:')
              print('\n'.join(unexpected))
              raise SystemExit(1)

          if error_lines:
              print('Only the two known baseline TypeScript errors remain.')
          PY

          if [ "$status" -eq 0 ]; then
            echo "TypeScript passed without errors."
          fi

      - name: Lint changed TypeScript files
        run: npx eslint src/app/inventory.tsx src/app/inventory-list.tsx src/inventory/storage.ts src/app/index.tsx src/app/_layout.tsx

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/inventory.tsx package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "feat: persist confirmed inventory locally"
          git push
